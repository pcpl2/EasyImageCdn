[package]
name = "EasyImageCdn"
version = "0.3.0"
edition = "2021"

[dependencies]
actix-web = "4.10.2"
actix-files = "0.6.6"
futures = "0.3.31"
actix-multipart = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
image = "0.25.4"
xxhash-rust = { version = "0.8.12", features = ["xxh3", "const_xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
