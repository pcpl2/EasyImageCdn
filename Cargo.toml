[package]
name = "EasyImageCdn"
version = "0.3.0"
edition = "2021"

[dependencies]
actix-web = "4.10.2"
actix-files = "0.6.6"
actix-web-actors = "4"
actix-multipart = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
image = "0.25.4"
xxhash-rust = { version = "0.8.12", features = ["xxh3", "const_xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.44.2", features = ["full"] }
derive_more = "2.0.1"
anyhow = "1.0.98"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3.31"
dashmap = "6.1.0"
bytes = "1.10.1"
actix = "0.13.5"
mime = "0.3.17"
qstring = "0.7.2"
dotenv = "0.15.0"
webp = "0.3"