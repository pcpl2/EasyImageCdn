name: Publish new version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Server version (format: Major.Minor.HotFix, example: 1.2.12)'
        required: true
      prerelease:
        description: 'Is Prerelease version'
        required: true
        type: boolean
jobs:
  build:
    name: Build and publish  ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04
          arch: amd64
          platforms: linux/amd64
        - os: ubuntu-24.04-arm
          arch: arm64
          platforms: linux/arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Login to Github packages
      uses: docker/login-action@v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    - name: Login to Docker hub
      uses: docker/login-action@v3.4.0
      with:
        username: ${{ secrets.DH_USERNAME }}
        password: ${{ secrets.DH_TOKEN }}

    - name: Build and push image ${{ matrix.platforms }}
      uses: docker/build-push-action@v6.16.0
      with:
        context: .
        platforms: ${{ matrix.platforms }}
        push: true
        tags: |
          pcpl2/easy_image_cdn:${{ github.event.inputs.version }}-${{ matrix.arch }}
          ghcr.io/pcpl2/easy_image_cdn:${{ github.event.inputs.version }}-${{ matrix.arch }}
        build-args: |
          App_Version=${{ github.event.inputs.version }}

  manifest:
    name: Create multiarch manifest
    runs-on: ubuntu-latest
    needs: [build]

    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3.4.0
      with:
        username: ${{ secrets.DH_USERNAME }}
        password: ${{ secrets.DH_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_TOKEN }}

    - name: Create and push manifest (Docker Hub)
      run: |
        docker manifest create pcpl2/easy_image_cdn:${{ github.event.inputs.version }} \
          pcpl2/easy_image_cdn:${{ github.event.inputs.version }}-amd64 \
          pcpl2/easy_image_cdn:${{ github.event.inputs.version }}-arm64
        docker manifest push pcpl2/easy_image_cdn:${{ github.event.inputs.version }}

    - name: Create and push manifest (GHCR)
      run: |
        docker manifest create ghcr.io/pcpl2/easy_image_cdn:${{ github.event.inputs.version }} \
          ghcr.io/pcpl2/easy_image_cdn:${{ github.event.inputs.version }}-amd64 \
          ghcr.io/pcpl2/easy_image_cdn:${{ github.event.inputs.version }}-arm64
        docker manifest push ghcr.io/pcpl2/easy_image_cdn:${{ github.event.inputs.version }}

  createRelease:
    name: Create Release ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    needs: [ manifest ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Create release on github
      uses: softprops/action-gh-release@v2.2.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Release ${{ github.event.inputs.version }}
        prerelease: ${{ github.event.inputs.prerelease }}
        tag_name: ${{ github.event.inputs.version }}